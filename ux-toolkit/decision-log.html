<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UX Decision Log</title>
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--card:#1a1a25;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#eee;--text2:#999;--text3:#666;--accent:#7c5cfc;--accent2:#a78bfa;--accent-bg:rgba(124,92,252,0.1);--green:#10b981;--green-bg:rgba(16,185,129,0.1);--red:#ef4444;--font:'Segoe UI',system-ui,sans-serif;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}

.app{max-width:900px;margin:0 auto;padding:24px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px}
.header h1{font-size:1.5rem;font-weight:800;letter-spacing:-0.02em}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--border2);background:var(--bg2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#6d4de6}
.btn-sm{padding:5px 10px;font-size:0.75rem}
.btn-danger{border-color:rgba(239,68,68,0.3);color:var(--red)}
.btn-danger:hover{background:rgba(239,68,68,0.1)}
a.back{color:var(--text2);text-decoration:none;font-size:0.85rem}
a.back:hover{color:var(--accent2)}

/* Stats bar */
.stats{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat-chip{padding:6px 14px;border-radius:100px;background:var(--card);border:1px solid var(--border);font-size:0.78rem;color:var(--text2);font-weight:600}
.stat-chip strong{color:var(--accent2);margin-right:4px}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.15s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent2);background:var(--accent-bg)}

/* New Entry Form */
.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.form-overlay.open{display:flex}
.form-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:32px;width:100%;max-width:650px;max-height:90vh;overflow-y:auto}
.form-card h2{font-size:1.2rem;font-weight:800;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:0.78rem;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:0.88rem;outline:none;transition:border 0.2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{min-height:80px;resize:vertical;line-height:1.6}
.form-group select{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.tag-input{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--card);min-height:42px;cursor:text}
.tag-input .tag{padding:3px 10px;border-radius:100px;background:var(--accent-bg);color:var(--accent2);font-size:0.75rem;font-weight:600;display:flex;align-items:center;gap:4px}
.tag-input .tag .remove{cursor:pointer;opacity:0.6;font-size:0.85rem}
.tag-input .tag .remove:hover{opacity:1}
.tag-input input{border:none;background:none;color:var(--text);outline:none;font-size:0.82rem;flex:1;min-width:80px}

/* Decision Cards */
.entries{display:flex;flex-direction:column;gap:14px}
.entry-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:all 0.25s;position:relative}
.entry-card:hover{border-color:var(--border2);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.entry-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px}
.entry-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.01em;flex:1}
.entry-date{font-size:0.72rem;color:var(--text3);white-space:nowrap}
.entry-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.entry-tag{padding:3px 10px;border-radius:100px;font-size:0.7rem;font-weight:600}
.entry-tag.competency{background:var(--accent-bg);color:var(--accent2)}
.entry-tag.impact-high{background:var(--green-bg);color:var(--green)}
.entry-tag.impact-medium{background:rgba(245,158,11,0.1);color:#f59e0b}
.entry-tag.impact-low{background:rgba(100,100,100,0.1);color:#888}
.entry-tag.project{background:rgba(59,130,246,0.1);color:#60a5fa}

.entry-section{margin-bottom:12px}
.entry-section-label{font-size:0.7rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
.entry-section p{font-size:0.88rem;color:var(--text2);line-height:1.65}

.entry-actions{display:flex;gap:6px;position:absolute;top:16px;right:16px;opacity:0;transition:opacity 0.2s}
.entry-card:hover .entry-actions{opacity:1}

.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .icon{font-size:3rem;margin-bottom:16px;opacity:0.5}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--text2);margin-bottom:8px}
.empty-state p{font-size:0.88rem;max-width:400px;margin:0 auto}

/* Search */
.search-bar{position:relative;margin-bottom:16px}
.search-bar input{width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:0.88rem;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.search-bar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}
</style>
</head>
<body>
<div class="app">
  <a href="index.html" class="back">← Back to Toolkit</a>
  <div class="header">
    <h1>📋 UX Decision Log</h1>
    <div class="header-actions">
      <button class="btn" onclick="exportEntries()">Export JSON</button>
      <button class="btn" onclick="importEntries()">Import</button>
      <button class="btn btn-primary" onclick="openForm()">+ New Decision</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="search-bar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Search decisions..." oninput="renderEntries()">
  </div>

  <div class="filters" id="filters"></div>
  <div class="entries" id="entries"></div>
</div>

<!-- New Entry Form -->
<div class="form-overlay" id="formOverlay" onclick="if(event.target===this)closeForm()">
  <div class="form-card">
    <h2 id="formTitle">Log a Design Decision</h2>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>Decision Title</label>
      <input type="text" id="f-title" placeholder="e.g., Chose progressive disclosure over full-page settings">
    </div>
    <div class="form-group">
      <label>Project</label>
      <input type="text" id="f-project" placeholder="e.g., Health Dashboard Redesign">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Impact Level</label>
        <select id="f-impact">
          <option value="high">High Impact</option>
          <option value="medium">Medium Impact</option>
          <option value="low">Low Impact</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="form-group">
      <label>Context — What was the situation?</label>
      <textarea id="f-context" placeholder="What was happening? What triggered this decision? What constraints existed?"></textarea>
    </div>
    <div class="form-group">
      <label>Options Considered</label>
      <textarea id="f-options" placeholder="What alternatives did you evaluate? Why were they on the table?"></textarea>
    </div>
    <div class="form-group">
      <label>Decision & Rationale — What did you choose and WHY?</label>
      <textarea id="f-rationale" placeholder="This is the most important part. Explain your reasoning, trade-offs, and what evidence informed your choice."></textarea>
    </div>
    <div class="form-group">
      <label>Outcome — What happened?</label>
      <textarea id="f-outcome" placeholder="Metrics, user feedback, stakeholder response. If ongoing, note that."></textarea>
    </div>
    <div class="form-group">
      <label>Competency Tags (type and press Enter)</label>
      <div class="tag-input" id="tagInput" onclick="this.querySelector('input').focus()">
        <input type="text" placeholder="e.g., AI design, leadership, systems thinking" onkeydown="handleTagKey(event)">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeForm()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save Decision</button>
    </div>
  </div>
</div>

<input type="file" id="importInput" accept=".json" style="display:none">

<script>
const STORAGE='ux-decision-log';
let entries=JSON.parse(localStorage.getItem(STORAGE)||'[]');
let activeFilter='all';
let formTags=[];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

// ── Render ──
function renderEntries(){
  const container=document.getElementById('entries');
  const search=document.getElementById('search').value.toLowerCase();
  let filtered=entries.filter(e=>{
    if(activeFilter!=='all'){
      const tags=(e.tags||[]).map(t=>t.toLowerCase());
      if(!tags.includes(activeFilter.toLowerCase())&&e.impact!==activeFilter&&e.project?.toLowerCase()!==activeFilter.toLowerCase()) return false;
    }
    if(search){
      const hay=[e.title,e.context,e.rationale,e.outcome,e.project,...(e.tags||[])].join(' ').toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));

  if(!filtered.length){
    container.innerHTML=`<div class="empty-state"><div class="icon">📋</div><h3>${entries.length?'No matching decisions':'No decisions logged yet'}</h3><p>${entries.length?'Try adjusting your search or filters.':'Click "+ New Decision" to start capturing your design decisions. Every decision you log becomes fuel for case studies and interviews.'}</p></div>`;
    renderStats();renderFilters();return;
  }

  container.innerHTML=filtered.map(e=>`
    <div class="entry-card">
      <div class="entry-actions">
        <button class="btn btn-sm" onclick="editEntry('${e.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteEntry('${e.id}')">Delete</button>
      </div>
      <div class="entry-header">
        <div class="entry-title">${esc(e.title)}</div>
        <div class="entry-date">${formatDate(e.date)}</div>
      </div>
      <div class="entry-meta">
        ${e.project?`<span class="entry-tag project">${esc(e.project)}</span>`:''}
        <span class="entry-tag impact-${e.impact}">${e.impact} impact</span>
        ${(e.tags||[]).map(t=>`<span class="entry-tag competency">${esc(t)}</span>`).join('')}
      </div>
      <div class="entry-section"><div class="entry-section-label">Context</div><p>${esc(e.context)}</p></div>
      ${e.options?`<div class="entry-section"><div class="entry-section-label">Options Considered</div><p>${esc(e.options)}</p></div>`:''}
      <div class="entry-section"><div class="entry-section-label">Decision & Rationale</div><p>${esc(e.rationale)}</p></div>
      ${e.outcome?`<div class="entry-section"><div class="entry-section-label">Outcome</div><p>${esc(e.outcome)}</p></div>`:''}
    </div>
  `).join('');
  renderStats();renderFilters();
}

function renderStats(){
  const s=document.getElementById('stats');
  const high=entries.filter(e=>e.impact==='high').length;
  const projects=[...new Set(entries.map(e=>e.project).filter(Boolean))];
  s.innerHTML=`
    <div class="stat-chip"><strong>${entries.length}</strong> Decisions</div>
    <div class="stat-chip"><strong>${high}</strong> High Impact</div>
    <div class="stat-chip"><strong>${projects.length}</strong> Projects</div>
  `;
}

function renderFilters(){
  const f=document.getElementById('filters');
  const allTags=new Set();
  entries.forEach(e=>(e.tags||[]).forEach(t=>allTags.add(t)));
  const tags=['all',...allTags];
  f.innerHTML=tags.map(t=>`<button class="filter-btn${activeFilter===t?' active':''}" onclick="setFilter('${t}')">${t==='all'?'All':t}</button>`).join('');
}

function setFilter(f){activeFilter=f;renderEntries()}

// ── Form ──
function openForm(){
  document.getElementById('formOverlay').classList.add('open');
  document.getElementById('editId').value='';
  document.getElementById('formTitle').textContent='Log a Design Decision';
  document.getElementById('f-title').value='';
  document.getElementById('f-project').value='';
  document.getElementById('f-impact').value='high';
  document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('f-context').value='';
  document.getElementById('f-options').value='';
  document.getElementById('f-rationale').value='';
  document.getElementById('f-outcome').value='';
  formTags=[];renderFormTags();
}

function closeForm(){document.getElementById('formOverlay').classList.remove('open')}

function saveEntry(){
  const id=document.getElementById('editId').value;
  const entry={
    id:id||uid(),
    title:document.getElementById('f-title').value.trim(),
    project:document.getElementById('f-project').value.trim(),
    impact:document.getElementById('f-impact').value,
    date:document.getElementById('f-date').value,
    context:document.getElementById('f-context').value.trim(),
    options:document.getElementById('f-options').value.trim(),
    rationale:document.getElementById('f-rationale').value.trim(),
    outcome:document.getElementById('f-outcome').value.trim(),
    tags:[...formTags]
  };
  if(!entry.title||!entry.rationale){alert('Title and Rationale are required.');return}
  if(id){const idx=entries.findIndex(e=>e.id===id);if(idx>-1)entries[idx]=entry;}
  else entries.push(entry);
  persist();closeForm();renderEntries();
}

function editEntry(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  openForm();
  document.getElementById('editId').value=e.id;
  document.getElementById('formTitle').textContent='Edit Decision';
  document.getElementById('f-title').value=e.title;
  document.getElementById('f-project').value=e.project||'';
  document.getElementById('f-impact').value=e.impact;
  document.getElementById('f-date').value=e.date;
  document.getElementById('f-context').value=e.context||'';
  document.getElementById('f-options').value=e.options||'';
  document.getElementById('f-rationale').value=e.rationale||'';
  document.getElementById('f-outcome').value=e.outcome||'';
  formTags=[...(e.tags||[])];renderFormTags();
}

function deleteEntry(id){
  if(!confirm('Delete this decision?'))return;
  entries=entries.filter(e=>e.id!==id);persist();renderEntries();
}

// ── Tags ──
function handleTagKey(e){
  if(e.key==='Enter'&&e.target.value.trim()){
    e.preventDefault();formTags.push(e.target.value.trim());e.target.value='';renderFormTags();
  }
}
function renderFormTags(){
  const container=document.getElementById('tagInput');
  const input=container.querySelector('input');
  container.querySelectorAll('.tag').forEach(t=>t.remove());
  formTags.forEach((tag,i)=>{
    const el=document.createElement('span');el.className='tag';
    el.innerHTML=`${tag}<span class="remove" onclick="removeTag(${i})">×</span>`;
    container.insertBefore(el,input);
  });
}
function removeTag(i){formTags.splice(i,1);renderFormTags()}

// ── Persist ──
function persist(){localStorage.setItem(STORAGE,JSON.stringify(entries))}

// ── Export / Import ──
function exportEntries(){
  const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='ux-decision-log.json';a.click();
}
function importEntries(){document.getElementById('importInput').click()}
document.getElementById('importInput').addEventListener('change',function(){
  const file=this.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{try{const data=JSON.parse(e.target.result);if(Array.isArray(data)){entries=[...entries,...data];persist();renderEntries()}}catch(err){alert('Invalid JSON')}};
  reader.readAsText(file);this.value='';
});

// ── Helpers ──
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function formatDate(d){if(!d)return'';try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return d}}

// Init
renderEntries();
</script>
</body>
</html>
